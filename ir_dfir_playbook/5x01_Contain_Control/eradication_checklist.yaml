  - id: ERAD-012
    category: krbtgt
    target_host: domain
    description: Evaluate and, if justified, perform controlled double-reset of the krbtgt account.
    command_or_action: Obtain AD incident commander approval; coordinate two krbtgt password resets with full domain controller replication between resets.
    rationale: Compromised Kerberos trust material requires investigation for forged-ticket capability. Pass-the-Ticket alone does not prove krbtgt key compromise. Double-reset is justified if krbtgt material or Golden Ticket capability is confirmed, following domain-wide impact assessment.
    verification_command: Verify both password reset events, replication completion across domain controllers, and Kerberos authentication logs.
    expected_verification_result: Two approved resets completed with replication verified; old krbtgt-key tickets no longer accepted.
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-013
    category: credential
    target_host: domain
    description: Invalidate compromised Kerberos tickets and review affected privileged or service credentials.
    command_or_action: Purge compromised sessions and tickets; reset additional accounts only when evidence confirms exposure.
    verification_command: Review Kerberos authentication events and affected account sign-in logs after invalidation.
    expected_verification_result: No successful authentication using identified compromised tickets or revoked sessions.
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-014
    category: network
    target_host: perimeter
    description: Maintain outbound firewall denies for C2 IPs 185.220.101.47 and 91.234.99.107.
    command_or_action: Apply or confirm explicit egress deny rules for both IP addresses.
    verification_command: Review firewall policy and timestamped NetFlow records for both destinations over the post-block observation window.
    expected_verification_result: Both deny rules active; zero permitted outbound packets to either C2 IP after enforcement.
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-015
    category: network
    target_host: internal_network
    description: Maintain segmentation preventing unauthorized lateral movement between affected hosts and production systems.
    command_or_action: Enforce quarantine VLAN and approved internal access-control rules; permit only authorized IR jumpbox access.
    verification_command: Inspect VLAN assignments and firewall rules; test connectivity from user VLAN and IR jumpbox.
    expected_verification_result: Production access blocked; only explicitly authorized IR access succeeds.
    status: pending
    executed_at: null
    executed_by: null
