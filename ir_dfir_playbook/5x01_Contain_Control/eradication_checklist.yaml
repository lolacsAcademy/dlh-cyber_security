items:
  - id: ERAD-001
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove confirmed malicious payload files and temporary execution artifacts.
    command_or_action: Identify exact paths from preserved EDR evidence; remove confirmed malicious files after forensic preservation.
    verification_command: Test-Path for each confirmed file path; compare with endpoint live-response file listing.
    expected_verification_result: All identified malicious files absent; no matching artifacts in live-response results.
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-002
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove attacker-created scheduled tasks and registry persistence.
    command_or_action: Identify malicious task names and registry keys from endpoint evidence; delete confirmed persistence entries.
    verification_command: schtasks /query; Get-ScheduledTask; Get-ItemProperty for identified registry keys.
    expected_verification_result: No matching malicious tasks or registry persistence entries.
    status: pending
