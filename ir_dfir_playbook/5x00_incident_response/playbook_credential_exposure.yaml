playbook_id: PB-CRED-001
title: MedDefense Phishing Credential Compromise
owner_role: IR_Commander

applies_to:
  triggers:
    - Confirmed credential submission to a fake Microsoft login page
    - Successful Azure AD sign-in from an unfamiliar foreign IP
    - Suspicious account activity within one hour of phishing
  indicators:
    - Foreign IP absent from the user's normal sign-in history
    - Unrecognized MFA approval or device registration
    - Unexpected Epic, VPN, or mailbox access

severity_mapping:
  initial: SEV2
  escalate_if:
    - Confirmed broad exposure of patient records
    - Compromise affects multiple clinical accounts or sites
    - Patient safety impact becomes high
    - Clinical services experience a full outage

immediate_actions:
  - step: Declare SEV2 and notify the IR Commander
    owner: IR_Commander
    timebox_minutes: 2
  - step: Identify the account and establish the exposure window
    owner: Technical_Lead
    timebox_minutes: 4
  - step: Export available evidence before changing credentials
    owner: Technical_Lead
    timebox_minutes: 5
  - step: Decide whether to reset immediately or monitor briefly
    owner: IR_Commander
    timebox_minutes: 2
  - step: Begin approved containment and notify the Legal Liaison
    owner: Technical_Lead
    timebox_minutes: 2

evidence_preservation:
  - artifact: Active Directory authentication logs
    method: Export relevant log entries with timestamps and account identifiers
    before_step: Active Directory password reset
  - artifact: Azure AD sign-in logs
    method: Export successful and failed sign-ins including IP and MFA details
    before_step: Azure AD session revocation
  - artifact: Affected mailbox
    method: Export mailbox content and available message audit records
    before_step: Active Directory password reset
  - artifact: Recent data access audit
    method: Export Epic and available file access events for the exposure window
    before_step: Epic session termination

containment_actions:
  - step: Reset the compromised Active Directory password
    owner: Technical_Lead
    decision_point: IR Commander approves immediate reset after evidence capture
    trade_off: Stops password reuse but may interrupt legitimate clinical access

  - step: Revoke all Azure AD sessions for the affected account
    owner: Technical_Lead
    decision_point: Confirm sign-in evidence has been exported
    trade_off: Removes active cloud sessions but ends live session observation

  - step: Reset compromised MFA device registrations
    owner: Technical_Lead
    decision_point: Verify the user's identity through a trusted channel
    trade_off: Removes unauthorized authentication methods but requires user re-enrollment

  - step: Revoke active VPN tokens associated with the account
    owner: Technical_Lead
    decision_point: Identify active VPN connections and preserve relevant logs
    trade_off: Blocks remote network access but may disconnect legitimate work

  - step: Terminate active Epic sessions for the compromised account
    owner: Technical_Lead
    decision_point: Coordinate with clinical IT to prevent interruption of active patient care
    trade_off: Protects patient records but may disrupt clinical workflows

  - step: Choose immediate reset or short controlled observation
    owner: IR_Commander
    decision_point: >
      Reset immediately if patient data, privileged access, or clinical
      services are at risk. Brief observation is permitted only with
      IR Commander approval, continuous monitoring, and no evidence
      of ongoing harmful activity. Stop observation immediately if
      suspicious access continues.
    trade_off: >
      Immediate reset sacrifices visibility into attacker behavior.
      Brief observation may preserve evidence but risks additional compromise.

eradication_actions:
  - Remove unauthorized MFA registrations and authentication methods
  - Remove attacker-created mailbox forwarding rules
  - Disable unauthorized account permissions or persistence mechanisms
  - Verify no additional accounts were compromised

recovery_validation:
  - check: Test Active Directory and Azure AD authentication
    criterion: Legitimate user signs in successfully with new credentials and MFA
  - check: Review Azure AD and VPN activity after containment
    criterion: No unauthorized sessions or new suspicious sign-ins
  - check: Verify Epic access with clinical IT
    criterion: Authorized access restored without unexpected patient record activity
  - check: Review mailbox settings
    criterion: No unauthorized forwarding rules or delegated access remain

communication_plan:
  - audience: IR_Commander
    trigger: Credential compromise confirmed
    template: "<incident_status_template.md>"
  - audience: Executive_Sponsor
    trigger: Incident reaches SEV1 or scope expands
    template: "<executive_notification_template.md>"
  - audience: Legal_Liaison
    trigger: ePHI may have been accessible during the exposure window
    template: "<hipaa_assessment_template.md>"
  - audience: Communications_Lead
    trigger: Legal assessment identifies a potential notification requirement
    template: "<incident_communication_template.md>"

escalation_triggers:
  - Confirmed broad patient record exposure requires SEV1 review
  - Determine whether ePHI was accessible to the compromised account during the exposure window
  - Notify Legal Liaison for HIPAA breach assessment if ePHI access was possible
  - Escalate if unauthorized access continues after containment
  - Escalate if clinical operations or additional MedDefense sites become affected
  - Review escalation if SEV2 remains without progress for 60 minutes

post_incident_tasks:
  - Document the phishing entry point and complete incident timeline
  - Record the reset-versus-monitor decision and supporting evidence
  - Preserve investigation findings and HIPAA assessment outcome
  - Review identity controls and update relevant detection rules
  - Conduct lessons learned and assign corrective actions
