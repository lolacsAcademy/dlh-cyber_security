title: Windows Interpreter Abuse
id: 9b3c42a7-5e18-4f62-8d91-3a6e27c1f405
status: experimental
description: Detects Windows command and script interpreters launched by processes other than standard shells.
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process_name|endswith:
      - powershell.exe
      - cmd.exe
      - wscript.exe
      - cscript.exe
      - mshta.exe
  standard_parent:
    parent_process_name|endswith:
      - explorer.exe
      - cmd.exe
      - powershell.exe
  condition: selection and not standard_parent
falsepositives:
  - Legitimate MedDefense scripted maintenance launched by approved management tools
  - MedDefense administrators running approved maintenance scripts
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1059.003
